<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Philip Ojetoye – Software Engineering student and web developer at Miva Open University."
    />
    <title>Contact | Philip Ojetoye</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="container nav-wrap">
        <a class="logo" href="index.html">Philip Ojetoye</a>
        <button
          class="nav-toggle"
          id="navToggle"
          aria-label="Open menu"
          aria-expanded="false"
        >
          Menu
        </button>
        <nav id="mainNav" aria-label="Main navigation">
          <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="planner.html">Academic Planner</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
          </ul>
        </nav>
      </div>
    </header>
    <main id="main">
      <section class="page-title">
        <div class="container">
          <h1>Contact me</h1>
          <p>Send a message and I will get back to you.</p>
        </div>
      </section>

      <section class="section">
        <div class="container narrow">
          <form id="contactForm" novalidate>
            <div class="field">
              <label for="name">Name</label>
              <input type="text" id="name" name="name" autocomplete="name" />
              <span class="error" id="nameError"></span>
            </div>
            <div class="field">
              <label for="email">Email address</label>
              <input
                type="email"
                id="email"
                name="email"
                autocomplete="email"
              />
              <span class="error" id="emailError"></span>
            </div>
            <div class="field">
              <label for="phone">Phone number</label>
              <input
                type="text"
                id="phone"
                name="phone"
                inputmode="numeric"
                autocomplete="tel"
              />
              <span class="error" id="phoneError"></span>
            </div>
            <div class="field">
              <label for="message">Message</label>
              <textarea id="message" name="message" rows="5"></textarea>
              <span class="error" id="messageError"></span>
            </div>
            <button class="btn" type="submit">Send message</button>
            <p class="success" id="formSuccess" role="status"></p>
          </form>
        </div>
      </section>
    </main>
    <footer class="site-footer">
      <div class="container">
        <p>
          &copy; <span id="year">2026</span> Philip Ojetoye. COS 106 Term
          Project, Miva Open University.
        </p>
      </div>
    </footer>
    <script src="js/main.js"></script>
    <script src="js/contact.js"></script>
  </body>
</html>
